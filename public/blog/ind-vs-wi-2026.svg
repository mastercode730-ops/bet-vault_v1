<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0B"/>
      <stop offset="50%" stop-color="#1B1405"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F5D073"/>
      <stop offset="100%" stop-color="#A68B2A"/>
    </linearGradient>
    <linearGradient id="indiaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#128807"/>
    </linearGradient>
    <linearGradient id="wiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B1113"/>
      <stop offset="50%" stop-color="#A31C24"/>
      <stop offset="100%" stop-color="#FDB813"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="225" r="280" fill="url(#glow)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.05" stroke="#D4AF37" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Series Badge Top Center -->
  <g transform="translate(290, 40)">
    <rect width="220" height="34" rx="17" fill="#141414" stroke="url(#gold)" stroke-width="1.5"/>
    <text x="110" y="22" font-family="Montserrat, sans-serif" font-weight="800" font-size="12" fill="#F5D073" text-anchor="middle" letter-spacing="1.5">HOME SERIES 2026</text>
  </g>

  <!-- Match Format Badges -->
  <g transform="translate(60, 48)">
    <rect width="110" height="26" rx="6" fill="#1A1A1A" stroke="#FF9933" stroke-width="1"/>
    <text x="55" y="17" font-family="Montserrat, sans-serif" font-weight="700" font-size="11" fill="#FF9933" text-anchor="middle">3 ODIs</text>
  </g>
  <g transform="translate(630, 48)">
    <rect width="110" height="26" rx="6" fill="#1A1A1A" stroke="#00BAF2" stroke-width="1"/>
    <text x="55" y="17" font-family="Montserrat, sans-serif" font-weight="700" font-size="11" fill="#00BAF2" text-anchor="middle">5 T20Is</text>
  </g>

  <!-- Team Badges Center Clash -->
  <g transform="translate(400, 185)" filter="url(#shadow)">
    <!-- India Shield -->
    <g transform="translate(-140, -50)">
      <rect width="110" height="110" rx="22" fill="#141414" stroke="#FF9933" stroke-width="2"/>
      <circle cx="55" cy="45" r="26" fill="#1A202C" stroke="#FF9933" stroke-width="1.5"/>
      <text x="55" y="52" font-family="Montserrat, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">IND</text>
      <rect x="25" y="82" width="60" height="4" rx="2" fill="url(#indiaGrad)"/>
    </g>

    <!-- VS Badge -->
    <circle cx="0" cy="5" r="28" fill="url(#gold)" filter="url(#shadow)"/>
    <text x="0" y="12" font-family="Montserrat, sans-serif" font-weight="900" font-size="18" fill="#000000" text-anchor="middle">VS</text>

    <!-- West Indies Shield -->
    <g transform="translate(30, -50)">
      <rect width="110" height="110" rx="22" fill="#141414" stroke="#7B1113" stroke-width="2"/>
      <circle cx="55" cy="45" r="26" fill="#1A1112" stroke="#FDB813" stroke-width="1.5"/>
      <text x="55" y="52" font-family="Montserrat, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">WI</text>
      <rect x="25" y="82" width="60" height="4" rx="2" fill="url(#wiGrad)"/>
    </g>
  </g>

  <!-- Cricket Ball Element -->
  <g transform="translate(400, 285)">
    <circle cx="0" cy="0" r="15" fill="#8B1E1E" stroke="#F5D073" stroke-width="1.5"/>
    <path d="M -11 -4 Q 0 4, 11 -4" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 1"/>
  </g>

  <!-- Divider Line -->
  <line x1="80" y1="335" x2="720" y2="335" stroke="#D4AF37" stroke-width="1" opacity="0.25"/>

  <!-- Title Bottom -->
  <text x="400" y="375" font-family="Montserrat, sans-serif" font-weight="900" font-size="25" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    INDIA VS WEST INDIES <tspan fill="url(#gold)">2026</tspan>
  </text>
  <text x="400" y="405" font-family="sans-serif" font-weight="500" font-size="14" fill="#9CA3AF" text-anchor="middle">
    Sep 27 – Oct 17 • Schedule, Squads, Venues &amp; Match Analysis
  </text>
</svg>
